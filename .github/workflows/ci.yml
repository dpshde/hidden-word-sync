# Tests and typecheck on every push to main and every pull request. Deploys stay manual
# (`bun run deploy` from a machine logged in to Cloudflare), so this needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # keep in step with mise.toml
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
